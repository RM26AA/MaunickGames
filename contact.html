<!DOCTYPE html>
<html lang="en">
<head>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/logo2.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAUNICK GAMES - Contact</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        /* App Container */
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Content Scroll Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px; /* Space for bottom nav bar */
        }

        /* Header */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 150px;
            height: 90px;
            object-fit: contain;
        }

        .title {
            fontSize: 28px;
            color: #fff;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Form Groups */
        .form-group {
            display: flex;
            align-items: center;
            background-color: #111;
            border-radius: 10px;
            margin-bottom: 16px;
            padding: 0 12px;
            border: 1px solid #222;
        }

        .form-group-message {
            display: flex;
            align-items: flex-start;
            background-color: #111;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #222;
        }

        .icon {
            color: #fff;
            margin-right: 12px;
            font-size: 18px;
            width: 20px;
            text-align: center;
        }

        .form-group-message .icon {
            padding-top: 2px;
        }

        .input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            height: 50px;
            outline: none;
        }

        .input::placeholder {
            color: #aaa;
        }

        .input-message {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            height: 100px;
            resize: none;
            outline: none;
        }

        .input-message::placeholder {
            color: #aaa;
        }

        /* Submit Button */
        .button {
            background-color: #ff4757;
            padding: 14px 0;
            border-radius: 10px;
            text-align: center;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .button:active {
            transform: scale(0.98);
        }

        .button-text {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #0d0d0d;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #888;
            flex: 1;
            height: 100%;
            transition: color 0.2s;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 11px;
        }

        .nav-item.active {
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Content Scroll Area -->
        <div class="content-area">
            <!-- Header -->
            <div class="header">
                <img src="assets/logo1.png" alt="MAUNICK GAMES" class="logo" onerror="this.style.display='none';" />
                <h1 class="title">Contact</h1>
            </div>

            <!-- Form -->
            <form id="contact-form" onsubmit="handleSend(event)">
                <div class="form-group">
                    <i class="fa-solid fa-user icon"></i>
                    <input type="text" id="full-name" placeholder="Full Name" class="input" required />
                </div>

                <div class="form-group">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="email" id="email" placeholder="Email" class="input" autocapitalize="none" required />
                </div>

                <div class="form-group">
                    <i class="fa-solid fa-phone icon"></i>
                    <input type="tel" id="phone" placeholder="Phone" class="input" required />
                </div>

                <div class="form-group-message">
                    <i class="fa-solid fa-message icon"></i>
                    <textarea id="message" placeholder="Message" class="input-message" required></textarea>
                </div>

                <button type="submit" class="button">
                    <span class="button-text">Send Message</span>
                </button>
            </form>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="categories.html" class="nav-item">
                <i class="fa-solid fa-grip"></i>
                <span>Categories</span>
            </a>
            <a href="top-rated.html" class="nav-item">
                <i class="fa-solid fa-star"></i>
                <span>Top Rated</span>
            </a>
            <a href="upcoming.html" class="nav-item">
                <i class="fa-solid fa-calendar"></i>
                <span>Upcoming</span>
            </a>
            <a href="contact.html" class="nav-item active">
                <i class="fa-solid fa-envelope"></i>
                <span>Contact</span>
            </a>
        </nav>
    </div>

    <script>
        function handleSend(event) {
            event.preventDefault();

            const fullName = document.getElementById('full-name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!fullName || !email || !phone || !message) {
                alert('Please fill in all fields.');
                return;
            }

            alert('Message Sent: Thank you for contacting us!');
            document.getElementById('contact-form').reset();
        }
    </script>
</body>
</html>
