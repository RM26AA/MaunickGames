<!DOCTYPE html>
<html lang="en">
<head>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/logo2.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAUNICK GAMES</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 180px;
            height: 180px;
            object-fit: contain;
            animation: springLogo 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes springLogo {
            0% { 
                transform: scale(0); 
                opacity: 0; 
            }
            60% { 
                transform: scale(1.1); 
                opacity: 1; 
            }
            100% { 
                transform: scale(1); 
                opacity: 1; 
            }
        }
    </style>
</head>
<body>

    <img src="assets/logo1.png" alt="MAUNICK GAMES" class="logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
    <div id="fallback-logo" style="display:none; color: #fff; font-size: 28px; font-weight: bold; letter-spacing: 2px;">MAUNICK</div>

    <script>
        // Navigate after 2 seconds to home.html
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 2000);
        });
    </script>
</body>
</html>
